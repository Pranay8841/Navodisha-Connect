server:
  port: 8081

spring:
  application:
    name: navodisha-connect-backend
  profiles:
    default: local

app:
  name: "Navodisha Connect"
  version: "1.0.0"
  welcome-message: "Welcome to Navodisha Connect Base"

security:
  jwt:
    secret: ${JWT_SECRET:navodisha-connect-super-secure-jwt-signing-secret-key-2026-very-long}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 2592000000 # 30 days
